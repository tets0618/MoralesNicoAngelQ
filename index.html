<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>A Special Letter 💗</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">

        <h1>HI MAAM😜💗</h1>
        <p class="subtitle">🩷</p>

        <div class="letter-area">

            <!-- Pikachu -->
            <img
                src="https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/25.png"
                class="pokemon pikachu"
                alt="Pikachu"
            >

            <!-- Envelope -->
            <div class="envelope-container">

                <div class="envelope" id="envelope">

                    <!-- Letter Paper -->
                    <div class="letter">

                        <div class="paper-design">

                            <div class="paper-top">
                                <span>♡</span>
                                <span>✿</span>
                                <span>♡</span>
                            </div>

                            <div class="paper-line"></div>

                            <p>
                pero tol
                            </p>

                            <p>
                            
                            </p>

                            <p>
                                
                            </p>


                            <div class="paper-bottom">
                                <span>♡</span>
                                <span>✿</span>
                                <span>♡</span>
                            </div>

                        </div>

                    </div>

                    <!-- Envelope layers -->
                    <div class="envelope-back"></div>
                    <div class="left-fold"></div>
                    <div class="right-fold"></div>
                    <div class="bottom-fold"></div>
                    <div class="flap"></div>

                    <div class="heart">♥</div>

                </div>

            </div>

            <!-- Jigglypuff -->
            <img
                src="https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/39.png"
                class="pokemon jigglypuff"
                alt="Jigglypuff"
            >

        </div>

        <!-- Snorlax -->
        <div class="snorlax-container">
            <img
                src="https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/143.png"
                class="snorlax"
                alt="Snorlax"
            >
        </div>

        <button id="openBtn">💌 Unlock My Letter</button>

        <p id="status">🌷🌷🌷🌷</p>

        <footer>🩷🩷🩷🩷</footer>

    </div>

    <!-- QUIZ POPUP -->
    <div class="quiz-overlay" id="quizOverlay" hidden>

        <div class="quiz-box">

            <div class="quiz-heart">💗</div>

            <h2>quizz munaa...</h2>

            <p class="quiz-subtitle">
                Answer each question correctly to continue
            </p>

            <div class="progress">
                <span id="progressText">Question 1 of 3</span>

                <div class="progress-track">
                    <div class="progress-fill" id="progressFill"></div>
                </div>
            </div>

            <form id="quizForm">

                <!-- QUESTION 1 -->
                <div class="question-step active" id="question1">

                    <h3>Question 1</h3>

                    <p>
                        What adds interactivity and functionality
                        to a website?
                    </p>

                    <label>
                        <input type="radio" name="q1" value="A">
                        A. HTML
                    </label>

                    <label>
                        <input type="radio" name="q1" value="B">
                        B. CSS
                    </label>

                    <label>
                        <input type="radio" name="q1" value="C">
                        C. JavaScript
                    </label>

                    <label>
                        <input type="radio" name="q1" value="D">
                        D. PHP
                    </label>

                </div>

                <!-- QUESTION 2 -->
                <div class="question-step" id="question2">

                    <h3>Question 2</h3>

                    <p>
                        What is used to design and style a website?
                    </p>

                    <label>
                        <input type="radio" name="q2" value="A">
                        A. HTML
                    </label>

                    <label>
                        <input type="radio" name="q2" value="B">
                        B. CSS
                    </label>

                    <label>
                        <input type="radio" name="q2" value="C">
                        C. JavaScript
                    </label>

                    <label>
                        <input type="radio" name="q2" value="D">
                        D. Python
                    </label>

                </div>

                <!-- QUESTION 3 -->
                <div class="question-step" id="question3">

                    <h3>Question 3</h3>

                    <p>
                        What does HTML stand for?
                    </p>

                    <label>
                        <input type="radio" name="q3" value="A">
                        A. Hyper Text Markup Language
                    </label>

                    <label>
                        <input type="radio" name="q3" value="B">
                        B. High Text Machine Language
                    </label>

                    <label>
                        <input type="radio" name="q3" value="C">
                        C. Hyperlinks and Text Markup Language
                    </label>

                    <label>
                        <input type="radio" name="q3" value="D">
                        D. Home Tool Markup Language
                    </label>

                </div>

                <p id="feedback"></p>

                <button type="submit" class="submit-btn" id="submitBtn">
                    Check Answer 💕
                </button>

            </form>

        </div>

    </div>

    <script src="script.js"></script>

</body>
</html>
